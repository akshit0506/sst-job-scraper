# Filtering thresholds. Edit these freely — they're read at runtime.

# ---- Compensation floors ----
internship_min_stipend_inr_monthly: 75000     # > ₹75k/month
fulltime_min_ctc_inr_yearly: 2000000          # > ₹20 LPA

# For jobs with NO explicit comp, Claude estimates a band. A job passes if the
# estimated comp meets the threshold AND its inferred confidence is >= this level.
# "low" lets more jobs through (noisier); "high" is strict (fewer false positives).
min_enrichment_confidence: "medium"   # low | medium | high

# ---- Location ----
india_only: true                       # require India location
allow_remote_global: true              # accept "Remote (worldwide)" if not US/EU-only

# ---- Seniority gate (for SST: 4th-year interns + new grads only) ----
