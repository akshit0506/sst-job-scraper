# Curated list of Indian-relevant tech employers, grouped by the ATS
# their career portal uses. Slugs map directly to ATS public APIs.
#
# HOW TO VERIFY A SLUG (before adding):
#   Greenhouse: curl -s https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   Lever:      curl -s https://api.lever.co/v0/postings/<slug>?mode=json
#   Ashby:      curl -s https://api.ashbyhq.com/posting-api/job-board/<slug>
#   Workable:   curl -s https://apply.workable.com/api/v1/widget/accounts/<slug>
#
# If you add a company whose slug you're unsure of, run scripts/verify_slugs.py
# which will ping each endpoint and report 404s.

