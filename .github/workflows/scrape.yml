name: Scrape jobs

on:
  schedule:
    # Every 6 hours. Times are UTC — this hits 05:30, 11:30, 17:30, 23:30 IST.
    - cron: "0 */6 * * *"
  workflow_dispatch:   # manual trigger from the Actions tab

permissions:
  contents: write   # needed to commit the updated dedup SQLite file back

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          LOG_LEVEL: INFO
        run: python -m src.main

      - name: Commit updated dedup cache
        run: |
          git config user.name "sst-scraper-bot"
          git config user.email "sst-scraper@users.noreply.github.com"
          git add data/seen.sqlite || true
          git diff --cached --quiet || git commit -m "chore: update dedup cache [skip ci]"
          git push || true
